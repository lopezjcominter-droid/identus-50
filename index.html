<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identus 50 - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #1a1a1a; color: white; padding: 20px; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { background: white; padding: 20px; border-bottom: 1px solid #eee; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .setup-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-form { background: white; padding: 40px; border-radius: 8px; width: 90%; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar"><h2>Identus 50</h2></div>
        <div class="main">
            <div class="header"><h1>Identus 50 - Miami</h1></div>
            <div class="content" id="content"><div class="card"><h2>Bienvenido</h2><p>Haz clic en Configuración para conectar Supabase.</p></div></div>
        </div>
    </div>
    <div id="setupModal" class="setup-modal" style="display:none;">
        <div class="setup-form">
            <h1>Configuración</h1>
            <div class="form-group"><label>Contraseña:</label><input type="password" id="pwd"></div>
            <button onclick="verify()">Continuar</button>
        </div>
    </div>
    <script>
        function verify() {
            if (document.getElementById('pwd').value === '3010') {
                alert('Acceso correcto');
            }
        }
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('setupModal').style.display = 'flex';
        });
    </script>
</body>
</html>
